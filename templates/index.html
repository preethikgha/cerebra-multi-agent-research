<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Agent Research Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      padding: 24px 40px;
      border-bottom: 1px solid #2a2a4a;
    }

    header h1 {
      font-size: 24px;
      color: #a78bfa;
      font-weight: 600;
    }

    header p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .search-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .search-box input {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 15px;
      color: #e0e0e0;
      outline: none;
      margin-bottom: 14px;
    }

    .search-box input:focus {
      border-color: #a78bfa;
    }

    .search-box button {
      background: #a78bfa;
      color: #0f0f1a;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover { background: #c4b5fd; }
    .search-box button:disabled { background: #4b4b6b; cursor: not-allowed; }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      font-size: 14px;
      color: #a78bfa;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #2a2a4a;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: none; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 14px;
      font-weight: 600;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .card p, .card li {
      font-size: 14px;
      line-height: 1.7;
      color: #c0c0d0;
    }

    .report-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .report-card h2 {
      font-size: 14px;
      font-weight: 600;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    #report-content {
      font-size: 15px;
      line-height: 1.8;
      color: #e0e0e0;
      white-space: pre-wrap;
    }

    .sources-list { list-style: none; }

    .sources-list li {
      padding: 8px 0;
      border-bottom: 1px solid #2a2a4a;
    }

    .sources-list li:last-child { border-bottom: none; }

    .sources-list a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 13px;
    }

    .sources-list a:hover { text-decoration: underline; }

    .badge {
      display: inline-block;
      background: #2a2a4a;
      color: #a78bfa;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>Multi-Agent Research Assistant</h1>
    <p>Powered by LangGraph · Groq · Tavily</p>
  </header>

  <div class="container">

    <div class="search-box">
      <input type="text" id="query" placeholder="e.g. What is the impact of AI on healthcare?" />
      <button id="btn" onclick="runResearch()">Research</button>
      <div class="status" id="status">
        <div class="spinner"></div>
        <span>Agents are working — this takes 20-30 seconds...</span>
      </div>
    </div>

    <div class="results" id="results">

      <div class="report-card">
        <h2>Final Report</h2>
        <div id="report-content"></div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Critic Feedback</h2>
          <p id="critique-content"></p>
        </div>
        <div class="card">
          <h2>Research Iterations</h2>
          <p>The agents ran <span id="iterations" class="badge"></span> search iteration(s).</p>
        </div>
      </div>

      <div class="card">
        <h2>Sources</h2>
        <ul class="sources-list" id="sources-list"></ul>
      </div>

    </div>
  </div>

  <script>
    async function runResearch() {
      const query = document.getElementById("query").value.trim();
      if (!query) { alert("Please enter a query."); return; }

      document.getElementById("btn").disabled = true;
      document.getElementById("status").style.display = "flex";
      document.getElementById("results").style.display = "none";

      try {
        const res = await fetch("/research", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });

        const data = await res.json();

        document.getElementById("report-content").textContent = data.report;
        document.getElementById("critique-content").textContent = data.critique;
        document.getElementById("iterations").textContent = data.iterations;

        const sourcesList = document.getElementById("sources-list");
        sourcesList.innerHTML = "";
        data.sources.forEach(s => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="${s.url}" target="_blank">${s.title}</a>`;
          sourcesList.appendChild(li);
        });

        document.getElementById("results").style.display = "block";

      } catch(e) {
        alert("Something went wrong. Check your terminal for errors.");
      } finally {
        document.getElementById("btn").disabled = false;
        document.getElementById("status").style.display = "none";
      }
    }

    document.getElementById("query").addEventListener("keydown", function(e) {
      if (e.key === "Enter") runResearch();
    });
  </script>

</body>
</html>
